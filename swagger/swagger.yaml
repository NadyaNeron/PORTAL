            $ref: '#/definitions/tp.ErrorResponse'
        "500":
          description: обратитесь в поддержку
          schema:
            $ref: '#/definitions/tp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Создать клиента
      tags:
      - clients
    put:
      consumes:
      - application/json
      description: Обновление сущаствующего клиента
      operationId: create-client
      parameters:
      - description: Обновленный клиент
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tp.UpdateClientRequest'
      produces:
