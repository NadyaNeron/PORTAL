paths:
  /admin/reload:
    get:
      operationId: admin-reload
      responses:
        "200":
          description: OK
        "400":
          description: некорректный запрос
          schema:
            $ref: '#/definitions/tp.ErrorResponse'
        "401":
          description: токен просрочен или невалиден
          schema:
            $ref: '#/definitions/tp.ErrorResponse'
        "403":
          description: нет доступа для вполнения операции
          schema:
            $ref: '#/definitions/tp.ErrorResponse'
        "500":
          description: обратитесь в поддержку
          schema:
            $ref: '#/definitions/tp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Перезагрузить данные
      tags:
      - admin
  /clients:
    post:
      consumes:
      - application/json
      description: Создание нового клиента
      operationId: create-client
      parameters:
      - description: Новый клиент
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tp.CreateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
